[project]
name = "todo-skill"
version = "0.1.0"
description = "Reusable Python CLI for the local Todo API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
todo-cli = "todo_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_cli"]
